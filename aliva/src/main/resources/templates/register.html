<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Регистрация — ALIVA</title>
</head>

<body>

<h1>Регистрация</h1>

<form th:action="@{/register}"
      th:object="${registrationDto}"
      method="post">

    <div>
        <label>Username:</label>
        <input type="text"
               th:field="*{username}">

        <div th:if="${#fields.hasErrors('username')}"
             th:errors="*{username}">
        </div>
    </div>

    <br>

    <div>
        <label>Email:</label>
        <input type="email"
               th:field="*{email}">

        <div th:if="${#fields.hasErrors('email')}"
             th:errors="*{email}">
        </div>
    </div>

    <br>

    <div>
        <label>Пароль:</label>
        <input type="password"
               th:field="*{password}">

        <div th:if="${#fields.hasErrors('password')}"
             th:errors="*{password}">
        </div>
    </div>

    <br>

    <button type="submit">
        Зарегистрироваться
    </button>

</form>

<br>

<a href="/login">
    Уже есть аккаунт? Войти
</a>

</body>
</html>
