<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">

  <title>ALIVA — Категории</title>

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #111;
    }

    header {
      height: 80px;
      padding: 0 60px;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
      letter-spacing: 5px;
    }

    a {
      color: #111;
      text-decoration: none;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 50px 30px;
    }

    h1 {
      font-weight: 400;
    }

    form {
      display: flex;
      gap: 10px;
      margin: 30px 0;
    }

    input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
    }

    button {
      padding: 12px 20px;
      background: #111;
      color: white;
      border: none;
      cursor: pointer;
    }

    .category {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 0;
      border-bottom: 1px solid #ddd;
    }

    .delete {
      background: white;
      color: #111;
      border: 1px solid #ccc;
    }

  </style>

</head>

<body>
<div th:replace="~{admin/admin-header :: header}"></div>

<main class="container">

  <h1>
    Категории
  </h1>

  <form action="/admin/categories"
        method="post">

    <input type="text"
           name="name"
           placeholder="Название категории"
           required>

    <button type="submit">
      Добавить
    </button>

  </form>

  <div th:each="category : ${categories}"
       class="category">

        <span th:text="${category.name}">
            Сумки
        </span>

    <form th:action="@{/admin/categories/delete/{id}(id=${category.id})}"
          method="post"
          style="margin: 0;">

      <button type="submit"
              class="delete">
        Удалить
      </button>

    </form>

  </div>

</main>

</body>

</html>
