<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">

  <title>ALIVA — Заказы</title>

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #111;
    }

    header {
      height: 80px;
      padding: 0 60px;
      border-bottom: 1px solid #ddd;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
      letter-spacing: 5px;
    }

    a {
      color: #111;
      text-decoration: none;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 50px 30px;
    }

    h1 {
      font-weight: 400;
      margin-bottom: 40px;
    }

    .order {
      border: 1px solid #ddd;
      padding: 25px;
      margin-bottom: 25px;
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .order-number {
      font-size: 20px;
      font-weight: 600;
    }

    .customer {
      color: #666;
      margin-bottom: 20px;
    }

    .item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .total {
      text-align: right;
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }

    select {
      padding: 10px;
      border: 1px solid #ccc;
    }

    button {
      padding: 10px 18px;
      background: #111;
      color: white;
      border: none;
      cursor: pointer;
    }

    .status-form {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .empty {
      color: #777;
    }

  </style>

</head>

<body>
<div th:replace="~{admin/admin-header :: header}"></div>


<main class="container">

  <h1>
    Заказы
  </h1>

  <div th:if="${orders.isEmpty()}"
       class="empty">

    Заказов пока нет.

  </div>

  <div th:each="order : ${orders}"
       class="order">

    <div class="order-header">

      <div class="order-number">

        Заказ №
        <span th:text="${order.id}">
                    1
                </span>

      </div>

      <div>

                <span th:text="${order.status}">
                    NEW
                </span>

      </div>

    </div>

    <div class="customer">

      Клиент:

      <strong th:text="${order.user.username}">
        user
      </strong>

      <br>

      Email:

      <span th:text="${order.user.email}">
                user@mail.com
            </span>

    </div>
      <div class="order-contact">

          <p>
              <strong>Телефон клиента:</strong>
              <span th:text="${order.phone}"></span>
          </p>

          <p>
              <strong>Адрес доставки:</strong>
              <span th:text="${order.address}"></span>
          </p>

      </div>

    <div th:each="item : ${order.items}"
         class="item">

            <span>

                <span th:text="${item.product.name}">
                    Сумка
                </span>

                ×

                <span th:text="${item.quantity}">
                    1
                </span>

            </span>

      <span>

                <span th:text="${item.price * item.quantity}">
                    25000
                </span>

                ₸

            </span>

    </div>

    <div class="total">

      Итого:

      <span th:text="${order.totalPrice}">
                25000
            </span>

      ₸

    </div>

    <form th:action="@{/admin/orders/{id}/status(id=${order.id})}"
          method="post"
          class="status-form"
          style="margin-top: 20px;">

      <select name="status">

        <option th:each="status : ${statuses}"
                th:value="${status}"
                th:text="${status}"
                th:selected="${status == order.status}">
        </option>

      </select>

      <button type="submit">
        Изменить статус
      </button>

    </form>

  </div>

</main>

</body>

</html>
