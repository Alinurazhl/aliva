<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ALIVA — Товары</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

<div class="container py-4">

  <!-- HEADER -->

  <div class="d-flex align-items-center justify-content-between border-bottom pb-3">

    <!-- LOGO -->

    <a th:href="@{/products}"
       class="text-dark text-decoration-none fs-4 fw-bold">

      ALIVA

    </a>


    <!-- NAVIGATION -->

    <div class="d-flex align-items-center gap-4">

      <a th:href="@{/products}"
         class="text-dark text-decoration-none">

        Каталог

      </a>

      <a th:href="@{/categories}"
         class="text-dark text-decoration-none">

        Категории

      </a>

      <a th:href="@{/cart}"
         class="text-dark text-decoration-none">

        Корзина

      </a>

      <a th:href="@{/orders}"
         class="text-dark text-decoration-none">

        Мои заказы

      </a>

      <form th:action="@{/logout}" method="post" style="display: inline;">
        <button type="submit"
                class="btn btn-link text-dark text-decoration-none p-0">
          Выйти
        </button>
      </form>

    </div>

  </div>


  <!-- TITLE -->

  <div class="text-center mt-5">

    <h1>Коллекция ALIVA</h1>

    <p class="text-muted">
      Сумки и обувь
    </p>

  </div>


  <!-- FILTERS -->

  <form th:action="@{/products}"
        method="get"
        class="mt-4">

    <div class="row g-3">


      <!-- ПОИСК -->

      <div class="col-md-4">

        <label class="form-label">
          Поиск
        </label>

        <input type="text"
               name="name"
               th:value="${searchName}"
               class="form-control"
               placeholder="Название товара">

      </div>


      <!-- КАТЕГОРИЯ -->

      <div class="col-md-4">

        <label class="form-label">
          Категория
        </label>

        <select name="categoryId"
                class="form-select">

          <option value="">
            Все товары
          </option>

          <option th:each="category : ${categories}"
                  th:value="${category.id}"
                  th:text="${category.name}"
                  th:selected="${category.id == selectedCategory}">
          </option>

        </select>

      </div>


      <!-- ЦВЕТ -->

      <div class="col-md-4">

        <label class="form-label">
          Цвет
        </label>

        <input type="text"
               name="color"
               th:value="${selectedColor}"
               class="form-control"
               placeholder="Например: Black">

      </div>


      <!-- РАЗМЕР -->

      <div class="col-md-4">

        <label class="form-label">
          Размер
        </label>

        <input type="text"
               name="size"
               th:value="${selectedSize}"
               class="form-control"
               placeholder="Например: 38">

      </div>


      <!-- МИНИМАЛЬНАЯ ЦЕНА -->

      <div class="col-md-3">

        <label class="form-label">
          Цена от
        </label>

        <input type="number"
               name="minPrice"
               th:value="${minPrice}"
               class="form-control"
               placeholder="0">

      </div>


      <!-- МАКСИМАЛЬНАЯ ЦЕНА -->

      <div class="col-md-3">

        <label class="form-label">
          Цена до
        </label>

        <input type="number"
               name="maxPrice"
               th:value="${maxPrice}"
               class="form-control"
               placeholder="100000">

      </div>


      <!-- КНОПКА -->

      <div class="col-md-2 d-flex align-items-end">

        <button type="submit"
                class="btn btn-dark w-100">

          Найти

        </button>

      </div>

    </div>

  </form>


  <!-- PRODUCTS -->

  <div class="row row-cols-1 row-cols-md-3 g-4 mt-4">

    <div class="col"
         th:each="product : ${products}">

      <div class="card h-100 shadow-sm">


        <!-- IMAGE -->

        <a th:href="@{/products/{id}(id=${product.id})}"
           class="text-decoration-none">

          <img th:if="${product.image != null}"
               th:src="${product.image}"
               th:alt="${product.name}"
               class="card-img-top"
               style="height: 300px; object-fit: cover;">

          <div th:if="${product.image == null}"
               class="card-img-top d-flex align-items-center justify-content-center"
               style="height: 300px; background: #f5f5f5;">

                        <span class="text-muted">
                            Нет изображения
                        </span>

          </div>

        </a>


        <!-- INFO -->

        <div class="card-body d-flex flex-column">


          <!-- BRAND -->

          <p class="text-muted mb-1"
             th:text="${product.brand != null ? product.brand : 'ALIVA'}">

            Brand

          </p>


          <!-- NAME -->

          <h5 class="card-title"
              th:text="${product.name}">

            Product

          </h5>


          <!-- PRICE -->

          <p class="card-text"
             th:text="${product.price + ' ₸'}">

            25 000 ₸

          </p>


          <!-- DETAILS -->

          <a th:href="@{/products/{id}(id=${product.id})}"
             class="btn btn-dark mt-auto">

            Подробнее

          </a>

        </div>

      </div>

    </div>

  </div>


  <!-- PAGINATION -->

  <div class="d-flex justify-content-center mt-5"
       th:if="${products.totalPages > 1}">

    <nav>

      <ul class="pagination">


        <!-- PREVIOUS -->

        <li class="page-item"
            th:classappend="${products.first ? 'disabled' : ''}">

          <a class="page-link text-dark"
             th:href="@{/products(
                           page=${products.number - 1},
                           name=${searchName},
                           categoryId=${selectedCategory},
                           color=${selectedColor},
                           size=${selectedSize},
                           minPrice=${minPrice},
                           maxPrice=${maxPrice}
                       )}">

            ←

          </a>

        </li>


        <!-- PAGES -->

        <li class="page-item"
            th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}"
            th:classappend="${i == products.number ? 'active' : ''}">

          <a class="page-link"
             th:href="@{/products(
                           page=${i},
                           name=${searchName},
                           categoryId=${selectedCategory},
                           color=${selectedColor},
                           size=${selectedSize},
                           minPrice=${minPrice},
                           maxPrice=${maxPrice}
                       )}"
             th:text="${i + 1}">

            1

          </a>

        </li>


        <!-- NEXT -->

        <li class="page-item"
            th:classappend="${products.last ? 'disabled' : ''}">

          <a class="page-link text-dark"
             th:href="@{/products(
                           page=${products.number + 1},
                           name=${searchName},
                           categoryId=${selectedCategory},
                           color=${selectedColor},
                           size=${selectedSize},
                           minPrice=${minPrice},
                           maxPrice=${maxPrice}
                       )}">

            →

          </a>

        </li>

      </ul>

    </nav>

  </div>

</div>

</body>

</html>
