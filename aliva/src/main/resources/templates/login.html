<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <title>Вход — ALIVA</title>
</head>

<body>

<h1>Вход</h1>

<form th:action="@{/login}" method="post">

  <div>
    <label>Логин:</label>
    <input type="text"
           name="username"
           required>
  </div>

  <br>

  <div>
    <label>Пароль:</label>
    <input type="password"
           name="password"
           required>
  </div>

  <br>

  <div th:if="${param.error}">
    <p>Неверный логин или пароль</p>
  </div>

  <div th:if="${param.logout}">
    <p>Вы вышли из аккаунта</p>
  </div>

  <button type="submit">
    Войти
  </button>

</form>

<br>

<a href="/register">
  Нет аккаунта? Зарегистрироваться
</a>

</body>

</html>
